apiVersion: apps/v1
kind: Deployment
metadata:
  name: berkbal-static
  namespace: berkbal
  labels:
    app: berkbal-static
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: berkbal-static
  template:
    metadata:
      labels:
        app: berkbal-static
    spec:
      containers:
        - name: berkbal-github-io
          # Etiketi CI her master build'inde commit sha'si ile gunceller (sed).
          # Elle degistirme; Argo bu satirin degismesini gorup deploy eder.
          image: ghcr.io/berkbal/berkbal.github.io:97d168824bc099a611db15f0a716e769aca6bb13
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
            - name: health
              containerPort: 8081
          readinessProbe:
            httpGet:
              path: /healthz
              port: health
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 500m
              memory: 128Mi
