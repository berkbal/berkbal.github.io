apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: berkbal-static
  namespace: berkbal
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: berkbal-static
  # En az 2 pod: biri olurse/yeniden baslarsa digeri trafigi tasir.
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
