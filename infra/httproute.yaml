apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: berkbal-static-route
spec:
  parentRefs:
    - name: main-gw
      namespace: default
  hostnames:
    - berkbal.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: berkbal-static
          port: 8080
