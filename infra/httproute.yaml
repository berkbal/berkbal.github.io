apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: berkbal-static-route
  namespace: berkbal
spec:
  parentRefs:
    - name: main-gw
      namespace: default
  hostnames:
    - berkbal.com
  rules:
    # Umami tracker (first-party): only the script and the collect endpoint
    - matches:
        - path:
            type: Exact
            value: /stats/script.js
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplaceFullPath
              replaceFullPath: /script.js
      backendRefs:
        - name: umami
          namespace: umami
          port: 3000
    - matches:
        - path:
            type: Exact
            value: /stats/api/send
          method: POST
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplaceFullPath
              replaceFullPath: /api/send
      backendRefs:
        - name: umami
          namespace: umami
          port: 3000
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: berkbal-static
          port: 8080
