# berkbal.com statik site — nginx ayarlari
# Imaj icinde /etc/nginx/conf.d/default.conf olarak kopyalanir.
#
# Cache stratejisi:
#   HTML          -> no-cache (her istekte ETag ile dogrula; yeni deploy aninda gorunur)
#   CSS / JS      -> 1 yil immutable. index.html'de ?v=N ile cagriliyor; dosya
#                    degisince ?v= ARTIRILMAZSA tarayici ve Cloudflare eskisini tutar.
#   Fontlar       -> 1 yil immutable (icerik degismez)
#   favicon       -> 1 hafta

map $uri $cache_control {
    default                         "no-cache";
    ~*\.(?:css|js)$                 "public, max-age=31536000, immutable";
    ~*\.(?:woff2?|ttf|otf)$         "public, max-age=31536000, immutable";
    ~*\.(?:ico|png|jpe?g|gif|svg|webp|avif)$  "public, max-age=604800";
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    etag on;

    # Sikistirma (woff2 zaten sikistirilmis, listede yok)
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml image/x-icon;

    # Guvenlik basliklari (add_header alt bloklara miras gecmesin diye her yerde 'always' ve tek seviyede)
    add_header Cache-Control          $cache_control always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options        "DENY" always;

    location / {
        try_files $uri $uri/ =404;
    }
}

# Saglik kontrolu AYRI portta: Service sadece 80'i disari veriyor, 8081'e
# yalnizca kubelet (probe'lar) dogrudan pod IP'si uzerinden ulasir.
server {
    listen 8081;
    server_name _;
    access_log off;
    server_tokens off;

    location = /healthz {
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        return 404;
    }
}
