name: Docker Build and Publish

on:
  workflow_dispatch:  # Manuel tetikleme
  push:
    branches:
      - master

permissions:
  contents: read
  packages: write  # GITHUB_TOKEN ile ghcr'ye push, PAT gerekmiyor

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build \
            --label org.opencontainers.image.source=https://github.com/${{ github.repository }} \
            -t ghcr.io/berkbal/berkbal.github.io:latest \
            -t ghcr.io/berkbal/berkbal.github.io:${{ github.sha }} .

      - name: Push Docker image to GitHub Container Registry
        run: |
          docker push ghcr.io/berkbal/berkbal.github.io:latest
          docker push ghcr.io/berkbal/berkbal.github.io:${{ github.sha }}
