name: Docker Build and Publish

on:
  workflow_dispatch:  # Manuel tetikleme
  push:
    branches:
      - master
    # Sadece manifest degisikligi (CI'in kendi tag commit'i dahil) imaj build etmesin
    # (infra/nginx/** imaja girdigi icin listede YOK)
    paths-ignore:
      - "infra/*.yaml"
      - "README.md"

permissions:
  contents: write   # infra/kustomization.yaml'a yeni imaj tag'ini commit'lemek icin
  packages: write   # GITHUB_TOKEN ile ghcr'ye push, PAT gerekmiyor

# Ust uste push'larda tag commit'leri yarismasin
concurrency:
  group: docker-build-master
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/berkbal/berkbal.github.io

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build \
            --label org.opencontainers.image.source=https://github.com/${{ github.repository }} \
            --label org.opencontainers.image.revision=${{ github.sha }} \
            -t "$IMAGE:latest" \
            -t "$IMAGE:${{ github.sha }}" .

      - name: Push Docker image to GitHub Container Registry
        run: |
          docker push "$IMAGE:latest"
          docker push "$IMAGE:${{ github.sha }}"

      # GitOps: Argo CD infra/'yi izliyor; tag degisince yeni imaji deploy eder.
      # GITHUB_TOKEN ile yapilan push yeni workflow tetiklemez (dongu olmaz).
      - name: Update image tag in kustomization
        working-directory: infra
        run: |
          kustomize edit set image "$IMAGE=$IMAGE:${{ github.sha }}"
          git config user.name  "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add kustomization.yaml
          if git diff --cached --quiet; then
            echo "Tag zaten guncel"; exit 0
          fi
          git commit -m "deploy: berkbal-static ${GITHUB_SHA::7}"
          for i in 1 2 3; do
            git pull --rebase origin master && git push origin HEAD:master && exit 0
            sleep 5
          done
          exit 1
